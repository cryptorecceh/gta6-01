<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>Sunset Harbor — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1030; font-family: 'Trebuchet MS', Verdana, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; display: none; }
  #hud.on { display: block; }
  .panel { background: rgba(10, 8, 24, 0.62); border: 1px solid rgba(255, 190, 90, 0.35); border-radius: 10px; padding: 8px 12px; }
  #stats { position: absolute; top: 12px; left: 12px; font-size: 15px; line-height: 1.5; }
  #money { color: #7dff9a; font-weight: bold; font-size: 19px; }
  #healthbar { width: 170px; height: 12px; background: rgba(0,0,0,0.6); border-radius: 6px; margin-top: 4px; overflow: hidden; }
  #healthfill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5a4e, #ffb347); }
  #stars { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 30px; letter-spacing: 4px; color: #ffd94a; text-shadow: 0 0 12px rgba(255, 80, 40, 0.9); }
  #objective { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); max-width: 560px; text-align: center; font-size: 15px; }
  #objective b { color: #ffd94a; }
  #minimap { position: absolute; top: 12px; right: 12px; border: 2px solid rgba(255, 190, 90, 0.55); border-radius: 50%; background: rgba(8, 10, 28, 0.75); }
  #speedo { position: absolute; bottom: 16px; right: 16px; font-size: 26px; font-weight: bold; text-align: right; }
  #speedo small { font-size: 12px; color: #ffb347; display: block; }
  #hint { position: absolute; bottom: 16px; left: 12px; font-size: 13px; color: #ffe9c4; max-width: 340px; line-height: 1.5; }
  #crosshair { position: absolute; top: 50%; left: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; display: none; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; }
  #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
  #crosshair::after { top: 10px; left: 0; width: 22px; height: 2px; }
  #toast { position: absolute; bottom: 110px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: bold; color: #ffe9c4; text-shadow: 0 2px 8px #000; text-align: center; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 30%, rgba(255, 120, 60, 0.25), rgba(8, 6, 24, 0.88)); color: #fff; z-index: 5; }
  #overlay .card { max-width: 620px; padding: 34px 40px; text-align: center; background: rgba(12, 8, 30, 0.82); border: 2px solid #ff7a3c; border-radius: 18px; box-shadow: 0 0 60px rgba(255, 110, 40, 0.35); }
  #overlay h1 { margin: 0 0 4px; font-size: 52px; letter-spacing: 2px; color: #ffb347; text-shadow: 0 0 24px rgba(255, 140, 40, 0.8); }
  #overlay h2 { margin: 0 0 14px; font-size: 17px; font-weight: normal; color: #ff9d7a; letter-spacing: 3px; text-transform: uppercase; }
  #overlay p { font-size: 15px; line-height: 1.6; color: #ffe9c4; }
  #overlay .controls { font-size: 13px; color: #cbb8ff; line-height: 1.9; margin: 14px 0; }
  #overlay button { pointer-events: auto; font-size: 20px; font-weight: bold; padding: 13px 34px; margin: 6px; border: none; border-radius: 12px; cursor: pointer; background: linear-gradient(180deg, #ffb347, #ff6a2a); color: #2a0e00; box-shadow: 0 4px 0 #a83c00; }
  #overlay button:hover { filter: brightness(1.12); }
  #overlay button.ghost { background: rgba(255,255,255,0.14); color: #fff; box-shadow: none; border: 1px solid #888; font-size: 16px; }
  #touch { position: fixed; inset: 0; display: none; pointer-events: none; z-index: 4; }
  #touch .stick { position: absolute; bottom: 70px; left: 30px; width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35); }
  #touch .fire { position: absolute; bottom: 90px; right: 30px; width: 74px; height: 74px; border-radius: 50%; background: rgba(255, 90, 60, 0.55); border: 2px solid #fff; color: #fff; font-weight: bold; pointer-events: auto; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 640px) {
    #overlay h1 { font-size: 34px; }
    #overlay .card { padding: 20px; margin: 12px; }
    #minimap { width: 120px !important; height: 120px !important; }
    #objective { font-size: 12px; top: 52px; max-width: 92vw; }
    #hint { display: none; }
    #stars { font-size: 22px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="scene" aria-label="Sunset Harbor: an open-world crime game. Explore the city on foot or by car, take missions from Mara Voss, and dodge the harbor police."></canvas>
<div id="hud">
  <div id="stats" class="panel"><span id="money">$0</span><div id="healthbar"><div id="healthfill"></div></div><div id="armorline">♥ Health <span id="healthnum">100</span> &nbsp;·&nbsp; <span id="mislabel">No job yet</span></div></div>
  <div id="stars"></div>
  <div id="objective" class="panel"><b id="objtitle">Sunset Harbor</b><br><span id="objtext">Find Mara Voss — the gold marker on your map.</span></div>
  <canvas id="minimap" width="190" height="190"></canvas>
  <div id="speedo" class="panel"><span id="speednum">0</span><small>MPH · <span id="gear">ON FOOT</span></small></div>
  <div id="hint" class="panel">WASD move · Mouse look · Shift run · Space jump · E enter/exit car · F steal car · Click shoot · R reload · P pause · M mute</div>
  <div id="crosshair"></div>
  <div id="toast"></div>
</div>
<div id="touch"><div class="stick"></div><button class="fire" id="firebtn">FIRE</button></div>
<div id="overlay"><div class="card" id="menucard"></div></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
